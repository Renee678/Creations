# API gateway: single public entrypoint in front of the app service.
# Responsibilities: routing, per-client rate limits, upload size cap, request IDs, timeouts.

# Behind Caddy (production) the client address arrives in X-Forwarded-For. Trust it only from
# the private Docker network, so rate limits apply per real client, not to Caddy as a whole.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Image analysis calls a paid LLM, so uploads get a much tighter budget.
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

log_format gateway '$remote_addr [$time_local] "$request" $status '
                   'rt=$request_time upstream_rt=$upstream_response_time rid=$request_id';

upstream app {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    access_log /dev/stdout gateway;

    client_max_body_size 8m;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    add_header X-Request-ID $request_id always;
    limit_req_status 429;

    location = /api/looks {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://app;
    }

    # Personal analysis: up to 3 photos of up to 8 MB each, same paid-LLM budget as looks.
    location ~ ^/api/users/[0-9]+/analyses$ {
        client_max_body_size 25m;
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://app;
    }

    # Virtual try-on renders on a paid image model: same tight budget as the other uploads.
    location ~ ^/api/users/[0-9]+/tryons$ {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://app;
    }

    location /metrics {
        # Internal only: scraped from inside the compose network.
        allow 127.0.0.1;
        deny all;
        proxy_pass http://app;
    }

    # Catalog photos saved from the Polyvore dataset: a lookbook page loads dozens at once, and they
    # never change, so they skip the API rate limit and are cached by the browser.
    location /catalog-images/ {
        expires 7d;
        proxy_pass http://app;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://app;
    }
}
