<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平替搭子 StyleBuddy</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">平替搭子 <span>StyleBuddy</span></div>
    <nav id="tabs" hidden>
      <button data-tab="find" class="active">找平替</button>
      <button data-tab="style">我的风格</button>
      <button data-tab="trends">流行趋势</button>
      <button data-tab="profile">档案</button>
    </nav>
  </header>

  <main>
    <!-- Onboarding / profile form -->
    <section id="profile" class="panel" hidden>
      <h1 id="profile-title">先认识一下你</h1>
      <p class="muted">这些信息只用来给你更合身、更合预算的推荐。</p>
      <form id="profile-form">
        <label>昵称 <input name="nickname" required maxlength="60"></label>
        <div class="row">
          <label>身高 (cm) <input name="height_cm" type="number" min="120" max="220" required></label>
          <label>体重 (kg) <input name="weight_kg" type="number" min="30" max="200" step="0.1" required></label>
          <label>年龄 <input name="age" type="number" min="13" max="100" required></label>
        </div>
        <fieldset>
          <legend>身形</legend>
          <div id="shape-options" class="chips"></div>
        </fieldset>
        <fieldset>
          <legend>喜欢的风格（可多选）</legend>
          <div id="style-options" class="chips"></div>
        </fieldset>
        <label>每件单品的预算 (USD) <input name="budget_per_item" type="number" min="5" max="1000" value="30" required></label>
        <button type="submit" class="primary">保存</button>
        <p id="profile-msg" class="muted"></p>
      </form>
    </section>

    <!-- Find look-alikes -->
    <section id="find" class="panel" hidden>
      <h1>刷到喜欢的穿搭？</h1>
      <p class="muted">上传小红书 / TikTok / Instagram 的截图，我帮你把每件单品找出平价替代。</p>
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <img id="preview" alt="" hidden>
        <span id="drop-text">点击或拖入一张穿搭图</span>
      </label>
      <div id="status" class="status" hidden></div>
      <div id="results"></div>
    </section>

    <!-- Style memory -->
    <section id="style" class="panel" hidden>
      <h1>我的风格档案</h1>
      <p id="style-summary" class="lead"></p>
      <div id="style-bars"></div>
      <h3>常见颜色</h3>
      <div id="style-colours" class="chips static"></div>
      <p id="style-fit" class="muted"></p>
    </section>

    <!-- Trends -->
    <section id="trends" class="panel" hidden>
      <h1>当季流行趋势</h1>
      <p id="trends-meta" class="muted"></p>
      <div id="trend-list"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
