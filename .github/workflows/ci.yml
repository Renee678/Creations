name: CI

on:
  # Push only: each run is titled with the commit it tested (pull_request runs all show the PR title).
  # The checks still appear on the PR, since they attach to its head commit.
  push:
    branches: [main, "claude/**"]

concurrency:  # a newer push cancels the run it replaces
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  compose:
    # Boots the whole stack offline (seed catalog, fake LLM) and smoke-tests it through the gateway.
    runs-on: ubuntu-latest
    env:
      CATALOG_SOURCE: seed
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke_test.sh
      - name: The gateway follows a recreated api container (as a redeploy does)
        run: |
          api=$(docker compose ps -q api)
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$api")
          old=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$api")
          docker compose rm -sf api
          docker run -d --rm --name ip-taker --network "$net" alpine sleep 600  # may take the freed address
          docker compose up -d --no-deps --wait api
          new=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q api)")
          echo "api moved from $old to $new"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          echo "the gateway still proxies to the old api address"; exit 1
      - if: failure()
        run: docker compose logs

  e2e:
    # Clicks through the app in a real browser (offline: seed catalog, fake LLM). Screenshots of failures are uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -v
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
